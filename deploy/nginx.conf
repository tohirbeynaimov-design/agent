# Docker'siz o'rnatish uchun nginx namunasi.
# /etc/nginx/sites-available/agent-uz ga nusxalang, domenni o'zgartiring, so'ng:
#   sudo ln -s /etc/nginx/sites-available/agent-uz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d buyurtma.example.uz      # HTTPS sertifikati
server {
    listen 80;
    server_name buyurtma.example.uz;

    client_max_body_size 8m;

    # Real vaqtdagi xabarlar oqimi bufersiz o'tishi kerak
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
